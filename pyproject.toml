[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "okta-admin"
version = "2.3.17"
description = "Flask web UI for administering Okta applications across several orgs"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "Authlib>=1.3,<2",
    "azure-core>=1.29,<2",
    "azure-data-tables>=12,<13",
    "flask>=3,<4",
    "gunicorn>=22,<30",
    "markdown>=3.5,<4",
    "python-dotenv>=1,<2",
    "requests>=2.31,<3",
    "urllib3>=2,<3",
    "werkzeug>=3,<4",
]

[project.optional-dependencies]
keyring = ["keyring>=24,<26"]
dev = ["deptry>=0.20", "pytest>=9.0.3", "ruff>=0.5"]

[project.scripts]
okta-admin = "app:main"
okta-admin-setup-tokens = "setup_tokens:main"

[tool.setuptools]
py-modules = [
    "app",
    "guards",
    "howto",
    "okta_client",
    "settings",
    "setup_tokens",
]

[tool.ruff.lint]
extend-select = ["T20", "BLE", "S110", "S112"]

[tool.ruff.lint.per-file-ignores]
# The prints in the token setup script are interactive prompts, not diagnostics.
"setup_tokens.py" = ["T201"]

[tool.deptry]
pep621_dev_dependency_groups = ["dev"]

[tool.deptry.per_rule_ignores]
# gunicorn is started by the Dockerfile CMD, never imported.
DEP002 = ["gunicorn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
