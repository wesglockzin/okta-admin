[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "okta-admin"
version = "2.3.17"
description = "Flask web UI for administering Okta applications across several orgs"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "Authlib>=1.3,<2",
    "azure-data-tables>=12,<13",
    "flask>=3,<4",
    "gunicorn>=22,<30",
    "markdown>=3.5,<4",
    "python-dotenv>=1,<2",
    "requests>=2.31,<3",
    "urllib3>=2,<3",
]

[project.optional-dependencies]
keyring = ["keyring>=24,<26"]
dev = ["pytest>=8,<10", "ruff>=0.5"]

[project.scripts]
okta-admin = "app:main"
okta-admin-setup-tokens = "setup_tokens:main"

[tool.setuptools]
py-modules = [
    "app",
    "guards",
    "okta_client",
    "settings",
    "setup_tokens",
    "shared_docs",
    "shared_http",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
